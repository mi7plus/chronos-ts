[package]
name = "chronos-ts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance, parallelized time series forecasting and auto-ARIMA engine in Rust."
readme = "README.md"
homepage = "https://github.com/mi7plus/chronos-ts"
repository = "https://github.com/mi7plus/chronos-ts"
keywords = ["time-series", "arima", "sarima", "forecasting", "prophet"]
categories = ["science", "mathematics", "algorithms"]
exclude = [
    ".github/",
    "python/",
    "chronos_ts.pyi",
    "py.typed",
    "pyproject.toml",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
ndarray = { version = "0.15", features = ["serde"] }
statrs = "0.16"
rayon = "1.8"
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.20", optional = true }

# Correctly matched argmin optimization ecosystem
argmin = "0.10"
argmin-math = { version = "0.4", features = ["ndarray_0_15"] }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false