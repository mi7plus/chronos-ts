[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "chronos-ts"
version = "0.1.0"
description = "High-performance time series forecasting library written in Rust with Python bindings"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
]

[tool.maturin]
features = ["python"]
include = ["chronos_ts.pyi", "py.typed"]